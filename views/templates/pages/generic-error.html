{{ define "title" }}Erro inesperado{{ end }}

{{ define "main" }}
{{ template "auth-shell-start" . }}
    <div class="text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-rose-500/15 text-rose-600 dark:bg-rose-400/15 dark:text-rose-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008zm9-4.5a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" />
            </svg>
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">
            Algo deu errado
        </h1>
        <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-400">
            Não conseguimos concluir esta operação agora. Tente novamente em alguns instantes.
        </p>
        <div class="mt-8">
            <a
                href="/"
                class="inline-flex w-full items-center justify-center rounded-full bg-[#2f4538] px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-[#3d5a47] focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 dark:focus-visible:ring-emerald-400"
            >
                Ir para o início
            </a>
        </div>
    </div>
{{ template "auth-shell-end" . }}
{{ end }}

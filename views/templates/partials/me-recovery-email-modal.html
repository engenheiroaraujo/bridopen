{{ define "me-recovery-email-modal" }}
<div
    id="recovery-email-modal"
    class="qn-app-modal fixed inset-0 z-[1100] {{ if .OpenRecoveryEmailModal }}flex{{ else }}hidden{{ end }} items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="recovery-email-modal-title"
    aria-hidden="{{ if .OpenRecoveryEmailModal }}false{{ else }}true{{ end }}"
>
    <div
        class="qn-app-modal__backdrop absolute inset-0"
        data-recovery-email-dismiss
        aria-hidden="true"
    ></div>
    <div class="qn-app-modal__panel relative z-[1] w-full max-w-md p-6 sm:p-7">
        <h2 id="recovery-email-modal-title" class="text-lg font-semibold text-slate-900 dark:text-white">
            Alterar e-mail de recuperação
        </h2>
        <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">
            Enviaremos um link para confirmar o novo e-mail antes de ativá-lo na conta.
        </p>

        <form id="recoveryEmailForm" class="mt-5 space-y-4" method="post" action="/me/recovery-email" autocomplete="off" novalidate>
            {{csrfField}}
            {{ with .FieldErrors }}
            <div class="rounded-xl border border-red-200/90 bg-red-50/90 p-3 text-sm text-red-900 dark:border-red-900/50 dark:bg-red-950/40 dark:text-red-100" role="alert">
                <ul class="mt-2 list-inside list-none space-y-0.5">
                    {{ range $field, $msg := . }}
                    <li>{{ $msg }}</li>
                    {{ end }}
                </ul>
            </div>
            {{ end }}

            <label class="block" for="recovery_email">
                <span class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Novo e-mail de recuperação</span>
                <input
                    id="recovery_email"
                    name="recovery_email"
                    type="email"
                    required
                    autocomplete="email"
                    inputmode="email"
                    value="{{ .PendingRecoveryEmail }}"
                    class="w-full rounded-xl border border-slate-200/90 bg-white px-3 py-2 text-slate-900 shadow-sm outline-none ring-sky-500/30 placeholder:text-slate-400 focus:border-sky-500/50 focus:ring-2 dark:border-white/10 dark:bg-slate-950/80 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-emerald-500/40 dark:focus:ring-emerald-500/25{{ if index .FieldErrors "recovery_email" }} border-red-400 ring-red-400/30{{ end }}"
                    placeholder="Digite o novo e-mail"
                    aria-invalid="{{ if index .FieldErrors "recovery_email" }}true{{ else }}false{{ end }}"
                />
                {{ with index .FieldErrors "recovery_email" }}
                <p class="mt-1 text-xs text-red-600 dark:text-red-300">{{ . }}</p>
                {{ end }}
            </label>

            <label class="block" for="recovery_current_secret">
                <span class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Senha atual</span>
                <div class="relative">
                    <input
                        id="recovery_current_secret"
                        name="recovery_current_secret"
                        type="password"
                        required
                        autocomplete="off"
                        spellcheck="false"
                        readonly
                        onfocus="this.removeAttribute('readonly')"
                        data-lpignore="true"
                        data-1p-ignore="true"
                        class="w-full rounded-xl border border-slate-200/90 bg-white px-3 py-2 pr-11 text-slate-900 shadow-sm outline-none ring-sky-500/30 placeholder:text-slate-400 focus:border-sky-500/50 focus:ring-2 dark:border-white/10 dark:bg-slate-950/80 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-emerald-500/40 dark:focus:ring-emerald-500/25{{ if index .FieldErrors "current_password" }} border-red-400 ring-red-400/30{{ end }}"
                        aria-invalid="{{ if index .FieldErrors "current_password" }}true{{ else }}false{{ end }}"
                    />
                    <button
                        type="button"
                        aria-label="Mostrar senha"
                        aria-pressed="false"
                        data-password-target="recovery_current_secret"
                        class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md p-1 text-slate-500 transition hover:bg-slate-100 hover:text-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2f4538]/40 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-slate-100"
                    >
                        <svg class="icon-eye h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        <svg class="icon-eye-off hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
                {{ with index .FieldErrors "current_password" }}
                <p class="mt-1 text-xs text-red-600 dark:text-red-300">{{ . }}</p>
                {{ end }}
            </label>

            <div class="qn-app-modal__actions mt-6 pt-1">
                <button
                    type="button"
                    class="qn-app-modal__btn qn-app-modal__btn--secondary"
                    data-recovery-email-dismiss
                >
                    Cancelar
                </button>
                <button
                    type="submit"
                    class="qn-app-modal__btn qn-app-modal__btn--primary"
                >
                    Enviar confirmação
                </button>
            </div>
        </form>
    </div>
</div>
{{ end }}
